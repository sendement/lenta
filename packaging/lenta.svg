  <rect x="74" y="38" width="26" height="44" rx="6" fill="url(#side)"/>
  <rect x="44" y="28" width="40" height="60" rx="8" fill="url(#hot)"/>
  <path d="M58 48 L58 68 L73 58 Z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
  <!-- its reflection -->
  <rect x="44" y="92" width="40" height="10" rx="4" fill="url(#hot)" opacity=".25"/>
